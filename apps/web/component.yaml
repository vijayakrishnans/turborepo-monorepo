apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The web app (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  # How the site runs itself for orun.work's live Preview tab
  # (saas-parallel-baselining PB4): `orun preview` starts this, and a coding
  # session keeps it running while it works, so the person watches the site
  # change as it is built. It installs only this app's packages, then runs
  # `next dev` alone on the box's loopback, on a fixed port, with its heap
  # capped: the box is shared with the agent.
  preview:
    run:
      - sh
      - -c
      - pnpm install --frozen-lockfile --prefer-offline --filter "web..." && exec node_modules/.bin/next dev -H 127.0.0.1 -p 3000
    port: 3000
    path: /
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: turborepo-monorepo-web-{dev,stage,prod}.
    workerName: turborepo-monorepo-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: vijayakrishnan12994

    installCommand: pnpm install --frozen-lockfile
    # The app's page links nothing absolute (no sitemap, feed or Open Graph
    # image), so the build needs no origin: turbo builds the app and the
    # workspace packages it depends on (@repo/ui), then OpenNext bundles it.
    buildCommand: pnpm exec turbo run build --filter=web

    # Smoke: the home page is THIS app's (it names its own page file), the
    # shared @repo/ui Button rendered into it, and a static asset is served.
    # Not the product's name, which is the owner's to change and HTML-escaped
    # when it carries an `&` or `'`. Each response is buffered before grep so
    # an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'apps/web/app/page.tsx' && echo \"${html}\" | grep -q '>Open alert</button>' && svg=$(curl -sf \"${DEPLOYED_URL}/turborepo-light.svg\") && echo \"${svg}\" | grep -q '<svg'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
